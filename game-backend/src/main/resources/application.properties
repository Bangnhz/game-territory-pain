# Spring Boot Application Configuration
spring.application.name=territorial-paint-backend

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/territorial_paint?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT Configuration
# Requirements: 1.9, 1.10
# JWT expiration: 2 hours = 7200000 milliseconds
app.jwt.secret=your-256-bit-secret-key-change-this-in-production-min-32-chars
app.jwt.expiration-ms=7200000

# Service Key Configuration
# Requirements: 9.4
# This key is used by the Game Server to authenticate internal API requests
app.service.key=dev_service_key_secret_change_me

# Logging
logging.level.root=INFO
logging.level.com.territorypaint=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
