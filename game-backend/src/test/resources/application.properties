# Test Configuration
# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Disable schema.sql execution - let Hibernate create tables from entities
spring.sql.init.mode=never

# JWT Configuration (same as production)
app.jwt.secret=test-secret-key-for-testing-only-min-32-chars
app.jwt.expiration-ms=7200000

# Service Key Configuration (same as production)
app.service.key=test-service-key

# Logging
logging.level.root=WARN
logging.level.com.territorypaint=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
