version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: territorial-paint-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: territorial_paint
    ports:
      - "3306:3306"
    volumes:
      # Tự động nạp cấu trúc database từ schema.sql khi container khởi động lần đầu
      - ./game-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
    driver: local
